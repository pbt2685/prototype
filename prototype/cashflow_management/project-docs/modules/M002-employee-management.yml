  Employee: "Nhân Viên"
  employee_type: "Loại Nhân Viên"
  Regular: "Chính Thức"
  Intern: "Thực Tập Sinh"
  Freelancer: "Cộng Tác Viên"
  Attendance: "Chấm Công"
  Leave: "Nghỉ Phép"
  Performance Rating: "Đánh Giá Hiệu Suất"
  daily_rate: "Đơn Giá Ngày"
  payment_method: "Phương Thức Thanh Toán"
  Bank: "Chuyển Khoản"
  Cash: "Tiền Mặt"
  Present: "Có Mặt"
  Absent: "Vắng Mặt"
  On Leave: "Nghỉ Phép"
  late_minutes: "Số Phút Trễ"
  rating_score: "Điểm Đánh Giá"

dependencies: [M001]

priority: critical
estimated_effort: "5 days"

implementation_notes: |
  - Employee type drives entire salary calculation logic
  - Intern payments in cash create unique tracking needs
  - Performance rating system is critical for intern compensation
  - Attendance tracking more important for interns than regular employees
